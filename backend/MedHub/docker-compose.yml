
services:
  medhub.api:
    image: ${DOCKER_REGISTRY-}medhubapi
    container_name: MedHub.Api
    build:
      context: .
      dockerfile: src/MedHub.Api/Dockerfile
    depends_on:
      medhub-db:
        condition: service_healthy
      medhub-redis:
        condition: service_started
      medhub-idp:
        condition: service_started
    ports:
      - "5010:80"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__Database=Host=medhub-db;Port=5432;Database=medhub;Username=postgres;Password=postgres;SslMode=Disable
      - ConnectionStrings__Cache=medhub-redis:6379
      - Keycloak__BaseUrl=http://medhub-idp:8080
      
    healthcheck:
      test: ["CMD-SHELL", "dotnet --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  medhub-db:
    image: postgres:17-alpine
    container_name: MedHub.Db
    environment:
      - POSTGRES_DB=medhub
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/database:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d medhub" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  medhub-idp:
    image: quay.io/keycloak/keycloak:20.0.2
    container_name: MedHub.Identity
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./containers/identity:/opt/keycloak/data
      - ./files/medhub-realm-export.json:/opt/keycloak/data/import/medhub-realm.json
    ports:
      - 18080:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      
  medhub-minio:
    image: minio/minio:latest
    container_name: MedHub.MinIO
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"  # API порт (S3 compatible)
      - "9001:9001"  # Консоль управления (Web UI)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./.containers/minio/data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  medhub-seq:
    image: datalust/seq:2024.2
    container_name: MedHub.Seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=admin  
    volumes:
      - ./.containers/seq:/data
    ports:
      - "5341:5341"
      - "8081:80"
    restart: unless-stopped

  medhub-redis:
    image: redis:latest
    container_name: MedHub.Redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5